{% extends "base.html" %}

{% block title %}CodeBrain - Upload Documents to Knowledge Base{% endblock %}

{% block extra_css %}
<style>
    .upload-container {
        margin: 20px;
        padding: 20px;
    }
    
    .upload-area {
        border: 2px dashed #ddd;
        border-radius: 8px;
        padding: 60px 40px;
        text-align: center;
        background-color: #f8f9fa;
        margin: 30px 0;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
    }

    .upload-area:hover {
        border-color: #007bff;
        background-color: #f1f7ff;
    }

    .upload-area.dragover {
        border-color: #28a745;
        background-color: #e8f5e8;
        transform: scale(1.02);
    }

    .upload-area.uploading {
        border-color: #6c757d;
        background-color: #f8f9fa;
        opacity: 0.6;
        cursor: not-allowed;
    }

    .file-input-button {
        padding: 12px 30px;
        font-size: 16px;
        margin-bottom: 20px;
    }

    .upload-hint {
        color: #666;
        font-size: 14px;
        margin-top: 15px;
    }

    .submit-container {
        text-align: center;
        margin-top: 20px;
    }

    .submit-button {
        padding: 12px 40px;
        font-size: 16px;
    }

    .selected-file {
        margin-top: 15px;
        color: #28a745;
        font-weight: 500;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="upload-container">
    <h4 class="mb-4">Upload Documents to Knowledge Base</h4>
    <form method="post" enctype="multipart/form-data" id="uploadForm" onsubmit="return handleSubmit(event)">
        {% csrf_token %}
        <div class="upload-area" id="uploadArea">
            <input type="file" name="single_file" id="single_file" style="display: none;" onchange="updateFileName(this)">
            <button type="button" class="btn btn-primary file-input-button" id="selectFileBtn" onclick="document.getElementById('single_file').click()">
                Select File
            </button>
            <div class="upload-hint">
                Drag and drop files here or click to select
            </div>
            <div id="selected-file" class="selected-file"></div>
            <div id="uploadStatus" style="margin-top: 10px; color: #666;"></div>
        </div>
        <div class="submit-container">
            <button type="submit" class="btn btn-success submit-button" id="submitBtn">Upload & Ingest to Knowledge Base</button>
        </div>
    </form>
</div>

<script>
// Initialize drag and drop
document.addEventListener('DOMContentLoaded', function() {
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('single_file');
    const uploadHint = uploadArea.querySelector('.upload-hint');
    let isUploading = false;
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });
    
    ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, function(e) {
            if (!isUploading) highlight(e);
        }, false);
    });
    
    ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, function(e) {
            if (!isUploading) unhighlight(e);
        }, false);
    });
    
    uploadArea.addEventListener('drop', function(e) {
        if (isUploading) {
            e.preventDefault();
            e.stopPropagation();
            showUploadStatus('Upload in progress, please wait...', 'error');
            return;
        }
        handleDrop(e);
    }, false);
    
    window.setUploadStatus = function(uploading) {
        isUploading = uploading;
        if (uploading) {
            uploadArea.classList.add('uploading');
            uploadHint.textContent = 'Upload in progress, please wait...';
        } else {
            uploadArea.classList.remove('uploading');
            uploadHint.textContent = 'Drag and drop files here or click to select';
        }
    };
    
    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }
    
    function highlight(e) {
        uploadArea.classList.add('dragover');
        uploadHint.textContent = 'Release mouse to upload file';
    }
    
    function unhighlight(e) {
        uploadArea.classList.remove('dragover');
        uploadHint.textContent = 'Drag and drop files here or click to select';
    }
    
    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        
        showUploadStatus('');
        document.getElementById('selected-file').textContent = '';
        
        if (files.length > 0) {
            handleFiles(files[0]);
        }
    }
    
    function handleFiles(file) {
        const fileCategories = {
            "CSV": [".csv"],
            "E-mail": [".eml", ".msg", ".p7s"],
            "EPUB": [".epub"],
            "Excel": [".xls", ".xlsx"],
            "HTML": [".html"],
            "Image": [".bmp", ".heic", ".jpeg", ".png", ".tiff"],
            "Markdown": [".md"],
            "Org Mode": [".org"],
            "Open Office": [".odt"],
            "PDF": [".pdf"],
            "Plain text": [".txt"],
            "PowerPoint": [".ppt", ".pptx"],
            "reStructured Text": [".rst"],
            "Rich Text": [".rtf"],
            "TSV": [".tsv"],
            "Word": [".doc", ".docx"],
            "XML": [".xml"]
        };
        
        const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
        const supportedExtensions = Object.values(fileCategories).flat();
        
        if (!supportedExtensions.includes(fileExtension)) {
            showUploadStatus('Unsupported file type', 'error');
            return;
        }
        
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;
        
        updateFileName(fileInput);
    }
    
    function showUploadStatus(message, type = 'info') {
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.textContent = message;
        statusDiv.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#666';
    }
});

function updateFileName(input) {
    const selectedFile = document.getElementById('selected-file');
    if (input.files && input.files[0]) {
        selectedFile.style.display = 'block';
        selectedFile.textContent = 'Selected file: ' + input.files[0].name;
    } else {
        selectedFile.style.display = 'none';
        selectedFile.textContent = '';
    }
}

async function handleSubmit(event) {
    event.preventDefault();
    
    const form = event.target;
    const fileInput = form.querySelector('input[type="file"]');
    const submitBtn = document.getElementById('submitBtn');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const statusDiv = document.getElementById('uploadStatus');
    
    if (!fileInput.files || !fileInput.files[0]) {
        statusDiv.textContent = 'Please choose a file to upload first';
        statusDiv.style.color = '#dc3545';
        return false;
    }

    submitBtn.disabled = true;
    selectFileBtn.disabled = true;
    
    if (window.setUploadStatus) {
        window.setUploadStatus(true);
    }
    
    statusDiv.textContent = 'Uploading file, please wait...';
    statusDiv.style.color = '#dc3545';
    statusDiv.style.fontWeight = 'bold';

    try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        });

        const result = await response.json();

        if (result.success) {
            statusDiv.textContent = `Upload successful! Successfully imported ${result.count} vector records`;
            statusDiv.style.color = '#28a745';
            fileInput.value = '';
            document.getElementById('selected-file').style.display = 'none';
        } else {
            statusDiv.textContent = result.error || 'Upload failed, please retry';
            statusDiv.style.color = '#dc3545';
        }
    } catch (error) {
        statusDiv.textContent = 'An error occurred during upload, please retry';
        statusDiv.style.color = '#dc3545';
    } finally {
        submitBtn.disabled = false;
        selectFileBtn.disabled = false;
        
        if (window.setUploadStatus) {
            window.setUploadStatus(false);
        }
    }

    return false;
}
</script>
{% endblock %}
